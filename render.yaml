services:
  - type: web
    name: vibe-trading
    env: python
    buildCommand: "pip install -r agent/requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "python agent/api_server.py --host 0.0.0.0"
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ALLOW_UNAUTHENTICATED_REMOTE
        value: "true"
      - key: LANGCHAIN_PROVIDER
        value: "gemini"
      - key: LANGCHAIN_MODEL_NAME
        value: "gemini-3.6-flash"
