services:
  - type: web
    name: vibe-trading
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ALLOW_UNAUTHENTICATED_REMOTE
        value: "true"
      - key: LANGCHAIN_PROVIDER
        value: "gemini"
      - key: LANGCHAIN_MODEL_NAME
        value: "gemini-2.5-flash"
